<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with dark gradient -->
  <rect width="100" height="100" rx="24" fill="#0A0E1A" />
  <rect width="96" height="96" x="2" y="2" rx="22" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.4" />
  
  <!-- Stylized Hand & Voice Waveforms -->
  <g filter="url(#glow)">
    <!-- Palm & wrist -->
    <path d="M42 75 C42 68, 45 62, 47 55" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Thumb -->
    <path d="M38 58 Q30 52 32 44 Q35 39 40 46" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Index Finger -->
    <path d="M44 48 L46 26 Q49 22 52 26 L51 47" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Middle Finger -->
    <path d="M52 47 L55 22 Q58 18 61 22 L60 47" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Ring Finger -->
    <path d="M60 48 L64 28 Q67 25 70 29 L67 50" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Pinky Finger -->
    <path d="M67 52 L73 38 Q76 35 78 39 L74 56" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <!-- Soundwaves emitting from hand (Sign -> Voice synthesis) -->
    <path d="M22 36 A18 18 0 0 0 22 64" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M16 28 A28 28 0 0 0 16 72" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.6" />
    <path d="M82 36 A18 18 0 0 1 82 64" stroke="#7B2CBF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
